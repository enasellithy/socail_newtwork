name: Grok AutoPR

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  grok-autopr:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'grok') || contains(github.event.issue.labels.*.name, 'grok')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Analyze issue with Grok
      id: grok
      env:
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Install dependencies
        npm install -g typescript ts-node @types/node
        
        # Create Grok analyzer script
        cat > analyze.ts << 'EOF'
        const issueBody = process.env.ISSUE_BODY || '';
        const issueTitle = process.env.ISSUE_TITLE || '';
        
        async function callGrok() {
          const response = await fetch('https://api.x.ai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${process.env.XAI_API_KEY}`
            },
            body: JSON.stringify({
              model: 'grok-2-latest',
              messages: [
                {
                  role: 'system',
                  content: 'You are a Laravel/PHP expert. Analyze GitHub issues and provide detailed implementation plans.'
                },
                {
                  role: 'user',
                  content: `Issue Title: ${issueTitle}\n\nIssue Body: ${issueBody}\n\nRepository: PHP Laravel project\n\nProvide a detailed plan to solve this issue including file changes needed.`
                }
              ]
            })
          });
          
          const data = await response.json();
          console.log('::set-output name=plan::' + encodeURIComponent(data.choices[0].message.content));
        }
        
        callGrok();
        EOF
        
        # Run analysis
        export ISSUE_BODY="${{ github.event.issue.body }}"
        export ISSUE_TITLE="${{ github.event.issue.title }}"
        ts-node analyze.ts

    - name: Generate code with Grok
      env:
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      run: |
        # Create code generator
        cat > generate.ts << 'EOF'
        async function generateCode() {
          const response = await fetch('https://api.x.ai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${process.env.XAI_API_KEY}`
            },
            body: JSON.stringify({
              model: 'grok-2-latest',
              messages: [
                {
                  role: 'system',
                  content: 'You are a Laravel testing expert. Generate complete PHPUnit test files.'
                },
                {
                  role: 'user',
                  content: `Generate PHPUnit tests for all functions in app/ directory for a Laravel project.
                  
Requirements:
- Create tests in tests/Unit/ matching app/ structure
- Include edge cases
- Mock external services
- Use Pest or PHPUnit syntax
- Return complete file contents ready to save`
                }
              ]
            })
          });
          
          const data = await response.json();
          const content = data.choices[0].message.content;
          
          // Parse code blocks and create files
          const codeBlocks = content.match(/```[\w]*\n([\s\S]*?)```/g) || [];
          
          codeBlocks.forEach((block, index) => {
            const code = block.replace(/```[\w]*\n/, '').replace(/```$/, '');
            const filename = `tests/Unit/GeneratedTest${index}.php`;
            require('fs').writeFileSync(filename, code);
            console.log(`Created: ${filename}`);
          });
        }
        
        generateCode();
        EOF
        
        mkdir -p tests/Unit
        ts-node generate.ts

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Add unit tests for app/ directory - Grok generated"
        title: "Grok: Unit tests for issue #${{ github.event.issue.number }}"
        body: |
          This PR was automatically generated by Grok to solve issue #${{ github.event.issue.number }}
          
          Changes:
          - Generated PHPUnit tests for all functions in app/ directory
          - Included edge cases
          - Mocked external services
          
          Closes #${{ github.event.issue.number }}
        branch: grok-tests-${{ github.event.issue.number }}
        base: main
