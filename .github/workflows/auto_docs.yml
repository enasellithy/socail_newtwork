name: AI Documentation Generator

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    if: contains(github.event.issue.title, 'documentation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub

      - name: Run AI Documenter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, re
          from github import Github, Auth

          auth = Auth.Token(os.environ['GITHUB_TOKEN'])
          g = Github(auth=auth)
          repo = g.get_repo(os.environ['REPO_NAME'])
          issue_number = os.environ.get('GITHUB_EVENT_PATH') # للحصول على رقم الـ Issue

          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          
          # مسح المجلدات الأساسية لفهم المشروع
          context = "Project structure and main classes:\n"
          for root, dirs, files in os.walk("."):
              if any(d in root for d in ["vendor", "node_modules", ".git", "storage"]): continue
              for f in files:
                  if f.endswith((".php", ".py", ".js")):
                      path = os.path.join(root, f)
                      with open(path, 'r') as file:
                          # نأخذ أول 50 سطر فقط من كل ملف لفهم الوظيفة (تقليل الكلمات)
                          context += f"\nFILE: {path}\n{file.read()[:500]}\n"

          prompt = f"Analyze this code and generate a TECHNICAL_DOCS.md file explaining the architecture, main components, and logic.\n\nCode Context:\n{context}\n\nFormat: FILE: TECHNICAL_DOCS.md\nCODE: ```markdown\n(content)\n```"

          response = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[{"role": "system", "content": "You are a technical writer."},
                        {"role": "user", "content": prompt}]
          )
          
          output = response.choices[0].message.content
          match = re.search(r"```markdown\s*(.*?)\s*```", output, re.DOTALL)
          
          if match:
              with open("TECHNICAL_DOCS.md", "w") as doc_file:
                  doc_file.write(match.group(1))
              
              # رفع التوثيق في برانش جديد
              branch_name = f"docs/issue-documentation"
              os.system(f"git config user.name 'AI Documenter'")
              os.system(f"git config user.email 'docs@bot.com'")
              os.system(f"git checkout -b {branch_name}")
              os.system(f"git add TECHNICAL_DOCS.md")
              os.system(f"git commit -m 'Generate technical documentation'")
              
              remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
              os.system(f"git remote set-url origin {remote_url}")
              os.system(f"git push origin {branch_name} --force")

              repo.create_pull(
                  title="📚 Auto-Generated Documentation",
                  body="This PR contains the technical documentation generated by AI.",
                  head=branch_name,
                  base=repo.default_branch
              )
          EOF
