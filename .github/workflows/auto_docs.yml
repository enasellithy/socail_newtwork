name: AI Deep Documentation Generator

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    if: contains(github.event.issue.title, 'documentation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub

      - name: Run AI Deep Documenter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, re
          from github import Github, Auth

          auth = Auth.Token(os.environ['GITHUB_TOKEN'])
          g = Github(auth=auth)
          repo = g.get_repo(os.environ['REPO_NAME'])

          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          
          # استهداف المجلدات الحيوية فقط لتعميق التوثيق دون استهلاك توكنز في ملفات غير مهمة
          target_dirs = ["app/Http/Controllers", "app/Models", "app/Services"]
          detailed_context = ""

          for t_dir in target_dirs:
              if os.path.exists(t_dir):
                  for root, _, files in os.walk(t_dir):
                      for f in files:
                          if f.endswith(".php"):
                              path = os.path.join(root, f)
                              with open(path, 'r') as file:
                                  content = file.read()
                                  # استخراج الدوال فقط لتقليل الضوضاء والتركيز على المنطق
                                  functions = re.findall(r"(public|protected|private)\s+function\s+(\w+)\s*\((.*?)\)", content)
                                  if functions:
                                      detailed_context += f"\n### CLASS: {f}\nPath: {path}\n"
                                      for scope, name, params in functions:
                                          detailed_context += f"- Function: {name}({params}) [%s]\n" % scope

          prompt = f"""
          Generate a detailed Technical Reference Manual.
          For each class and function provided, explain:
          1. The specific responsibility of the function.
          2. The parameters it accepts.
          3. How it fits into the Laravel lifecycle.
          
          Code Context:
          {detailed_context}
          
          Format the output as a clean Markdown table for each Class.
          FILE: TECHNICAL_DOCS.md
          CODE: ```markdown
          """

          response = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[{"role": "system", "content": "You are a Senior Technical Architect. Write exhaustive documentation."},
                        {"role": "user", "content": prompt}]
          )
          
          output = response.choices[0].message.content
          match = re.search(r"```markdown\s*(.*?)\s*```", output, re.DOTALL)
          
          if match:
              content = "# Technical Function Documentation\n\n" + match.group(1)
              with open("TECHNICAL_DOCS.md", "w") as doc_file:
                  doc_file.write(content)
              
              branch_name = "docs/detailed-function-ref"
              os.system(f"git config user.name 'AI Documenter'")
              os.system(f"git config user.email 'docs@bot.com'")
              os.system(f"git checkout -b {branch_name} || git checkout {branch_name}")
              os.system(f"git add TECHNICAL_DOCS.md")
              os.system(f"git commit -m 'Update detailed function documentation'")
              
              remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@[github.com/](https://github.com/){os.environ['REPO_NAME']}.git"
              os.system(f"git remote set-url origin {remote_url}")
              os.system(f"git push origin {branch_name} --force")

              try:
                  repo.create_pull(
                      title="📖 Detailed Function Documentation",
                      body="Automated deep-scan of application functions and logic.",
                      head=branch_name,
                      base=repo.default_branch
                  )
              except: pass
          EOF
