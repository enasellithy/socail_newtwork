name: Laravel AI Dev Agent (Groq)

on:
  push:
    branches: [ "main", "master", "dev" ]

jobs:
  ai_review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: pip install openai requests

      - name: Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # البحث عن الملف وتشغيله أينما كان
          FILE_PATH=$(find . -name "ai_agent.py" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ Error: ai_agent.py not found in the repo!"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi
          echo "🚀 Running: $FILE_PATH"
          python "$FILE_PATH"

      - name: Upload AI Review Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-ai-review
          path: ai_review.md
