name: Laravel AI Dev Agent

on:
  push:
    branches: [ "main", "master", "dev" ]

jobs:
  ai_review:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # دي أهم واحدة عشان يقدر يكتب الكومنت على الـ Commit
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run AI Review & Test Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          FILE_PATH=$(find . -name "ai_agent.py" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: ai_agent.py not found in the repository!"
            exit 1
          fi
          python "$FILE_PATH"
