name: Laravel AI Dev Agent

on:
  push:
    branches: [ "main", "master", "dev" ] # بيشتغل لما ترفع على الفروع دي

jobs:
  ai_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      repository-projects: write
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # عشان يحسب الفرق بين آخر commit واللي قبله

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install AI Library
        run: pip install google-generativeai requests

      - name: Run AI Review & Test Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: python .github/scripts/ai_agent.py
