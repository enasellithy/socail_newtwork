name: AutoPR with Groq

on:
  push:
    branches: [main]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autopr:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install jq -y
        
      - name: Check if label was added by a collaborator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_collaborator=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.event.sender.login }}" | jq -r '.message')

          if [ "$is_collaborator" == "Not Found" ]; then
            echo "Label not added by a collaborator. Skipping action."
            exit 78
          fi
          
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 1
          
      - name: AutoPR with Groq
        uses: irgolic/AutoPR@main
        env:
          # Use Groq instead of OpenAI
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: "https://api.groq.com/openai/v1"
          # Optional: specify a Groq model (uncomment one):
          # OPENAI_MODEL: "llama-3.3-70b-versatile"  # Fast & good for code
          # OPENAI_MODEL: "mixtral-8x7b-32768"       # Good for complex tasks
          # OPENAI_MODEL: "gemma2-9b-it"             # Fast & efficient
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
