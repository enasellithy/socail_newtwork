name: AI PR Generator with Groq

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

jobs:
  generate-pr:
    if: contains(github.event.label.name, 'ai-fix') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai PyGithub gitpython

      - name: Generate solution with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import openai
          from github import Github
          import git
          import re

          # Setup Groq client (OpenAI compatible)
          client = openai.OpenAI(
              api_key=os.environ['GROQ_API_KEY'],
              base_url="https://api.groq.com/openai/v1"
          )

          # Connect to GitHub
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo("${{ github.repository }}")
          
          # Get issue details
          issue_number = ${{ github.event.issue.number || github.event.inputs.issue_number }}
          issue = repo.get_issue(number=issue_number)
          
          print(f"Processing Issue #{issue_number}: {issue.title}")
          print(f"Body: {issue.body}")

          # Get repository structure
          repo_local = git.Repo(".")
          php_files = []
          for root, dirs, files in os.walk("app"):
              for file in files:
                  if file.endswith(".php"):
                      php_files.append(os.path.join(root, file))
          
          files_content = ""
          for pf in php_files[:5]:  # Limit to first 5 files to avoid token limits
              try:
                  with open(pf, 'r') as f:
                      content = f.read()
                      files_content += f"\n\n=== {pf} ===\n{content[:1000]}"
              except:
                  pass

          # Generate tests with Groq
          prompt = f"""
          Issue: {issue.title}
          Description: {issue.body}
          
          Repository files in app/ directory:
          {files_content}
          
          Generate PHPUnit tests for all public functions in the app/ directory.
          Requirements:
          1. Create tests in tests/Unit/ matching the app/ structure
          2. Include edge cases
          3. Mock external services
          4. Follow Laravel testing best practices
          
          Provide the complete test files content.
          """

          response = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[
                  {"role": "system", "content": "You are a Laravel testing expert. Generate comprehensive PHPUnit tests."},
                  {"role": "user", "content": prompt}
              ],
              temperature=0.2,
              max_tokens=4000
          )

          generated_content = response.choices[0].message.content
          print("Generated content:", generated_content[:500])

          # Parse and create test files
          # Extract PHP code blocks
          php_blocks = re.findall(r'```php\s*(.*?)\s*```', generated_content, re.DOTALL)
          
          if not php_blocks:
              # Try without language specifier
              php_blocks = re.findall(r'```\s*(<\?php.*?)```', generated_content, re.DOTALL)

          branch_name = f"ai-tests-issue-{issue_number}"
          
          # Create new branch
          current = repo_local.create_head(branch_name)
          current.checkout()

          # Create tests directory
          os.makedirs("tests/Unit", exist_ok=True)

          # Write test files
          for i, code in enumerate(php_blocks):
              # Extract class name
              class_match = re.search(r'class\s+(\w+)', code)
              if class_match:
                  class_name = class_match.group(1)
                  filename = f"tests/Unit/{class_name}.php"
              else:
                  filename = f"tests/Unit/GeneratedTest{i}.php"
              
              with open(filename, 'w') as f:
                  f.write(code)
              print(f"Created: {filename}")

          # Commit and push
          repo_local.git.add("tests/")
          repo_local.git.commit("-m", f"Add unit tests for issue #{issue_number}\n\nAI-generated tests using Groq")
          repo_local.git.push("--set-upstream", "origin", branch_name)

          # Create Pull Request
          pr = repo.create_pull(
              title=f"🤖 Auto-generated tests for #{issue_number}",
              body=f"This PR automatically generates PHPUnit tests for issue #{issue_number}.\n\n**Generated by:** Groq AI (llama-3.3-70b-versatile)\n\n**Changes:**\n- Added unit tests for app/ directory\n- Included edge cases\n- Mocked external services\n\nCloses #{issue_number}",
              head=branch_name,
              base="main"
          )
          
          print(f"Created PR: {pr.html_url}")
          EOF
