name: Cerebras Function Generator

on:
  push:
    paths:
      - 'app/Http/**'
      - 'app/SOLID/**'
  workflow_dispatch:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, gd
          coverage: none

      - name: Install Composer Dependencies
        run: |
          # استخدام --ignore-platform-reqs لتخطي فحص المتطلبات وتسريع العملية
          composer update --no-interaction --prefer-dist --no-scripts --ignore-platform-reqs
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Cerebras Generator
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python .github/scripts/generate_docs.py

      - name: Run PHPUnit Tests
        id: run-tests
        # تشغيل التستات مع تجاهل الأخطاء مؤقتاً لتحديد حالة المتغير
        run: php artisan test --testsuite=Unit || echo "tests_failed=true" >> $GITHUB_ENV

      - name: Open Issue on Test Failure
        if: env.tests_failed == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Test Failure: Automated Checks Failed',
              body: 'Tests failed after generating docs with Cerebras. Review logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })

      - name: Commit and Push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/
          git commit -m "Auto-update docs via Cerebras" || echo "No changes"
          git push
