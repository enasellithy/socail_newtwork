name: Groq Auto Issue Solver

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' || contains(github.event.label.name, 'ai-fix')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub gitpython

      - name: Run Solver
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, git, re, time
          from github import Github

          client = openai.OpenAI(
              api_key=os.environ['GROQ_API_KEY'],
              base_url="https://api.groq.com/openai/v1"
          )

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          repo_local = git.Repo(".")
          default_branch = repo.default_branch

          open_issues = [i for i in repo.get_issues(state='open') if not i.pull_request]

          for issue in open_issues:
              branch_name = f"fix/issue-{issue.number}"
              
              try:
                  repo.get_branch(branch_name)
                  continue
              except:
                  pass

              repo_local.git.checkout(default_branch)
              
              files_context = ""
              for root, _, files in os.walk("."):
                  if any(x in root for x in ["vendor", "node_modules", ".git", "tests"]): continue
                  for file in files:
                      if file.endswith(".php") or file.endswith(".json"):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r') as f:
                                  files_context += f"\n-- {path} --\n{f.read()[:1000]}\n"
                          except: pass

              prompt = f"Issue #{issue.number}: {issue.title}\n{issue.body}\nContext:\n{files_context}\nReturn files in format:\n// path/file.php\n```php\nCODE\n```"

              try:
                  response = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[
                          {"role": "system", "content": "You are a Laravel expert. Fix the issue and provide full file contents."},
                          {"role": "user", "content": prompt}
                      ]
                  )

                  content = response.choices[0].message.content
                  matches = re.findall(r'//\s*([^\n]+)\s*```(?:php)?\s*(.*?)\s*```', content, re.DOTALL)

                  if not matches: continue

                  new_branch = repo_local.create_head(branch_name)
                  new_branch.checkout()

                  for path, code in matches:
                      path = path.strip()
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w') as f:
                          f.write(code.strip())

                  repo_local.config_writer().set_value("user", "name", "AI Bot").release()
                  repo_local.config_writer().set_value("user", "email", "bot@ai.com").release()
                  
                  repo_local.git.add(A=True)
                  repo_local.git.commit("-m", f"Fix issue #{issue.number}")
                  
                  auth_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
                  if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                      remote = repo_local.create_remote('origin_auth', auth_url)
                  else:
                      remote = repo_local.remote('origin_auth')
                  
                  remote.push(refspec=f"{branch_name}:{branch_name}")

                  pr = repo.create_pull(
                      title=f"🤖 Fix #{issue_number}: {issue.title}",
                      body=f"This PR automatically fixes #{issue.number}.\n\nCloses #{issue.number}",
                      head=branch_name,
                      base=default_branch
                  )
                  
                  print(f"Created PR #{pr.number}")
                  time.sleep(10)

              except Exception as e:
                  print(f"Error on #{issue.number}: {e}")
          EOF
