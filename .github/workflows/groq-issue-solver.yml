name: Groq Issue Solver

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

jobs:
  solve-issue:
    if: contains(github.event.label.name, 'ai-fix') || contains(github.event.label.name, 'groq') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai PyGithub gitpython

      - name: Solve issue with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import openai
          from github import Github
          import git
          import re

          # Setup Groq client (OpenAI compatible)
          client = openai.OpenAI(
              api_key=os.environ['GROQ_API_KEY'],
              base_url="https://api.groq.com/openai/v1"
          )

          # Connect to GitHub
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo("${{ github.repository }}")
          
          # Get issue number
          if "${{ github.event_name }}" == "workflow_dispatch":
              issue_number = int("${{ github.event.inputs.issue_number }}")
          else:
              issue_number = ${{ github.event.issue.number }}
          
          issue = repo.get_issue(number=issue_number)
          
          print(f"Processing Issue #{issue_number}: {issue.title}")

          # Get repository PHP files
          repo_local = git.Repo(".")
          php_files = []
          for root, dirs, files in os.walk("app"):
              for file in files:
                  if file.endswith(".php"):
                      php_files.append(os.path.join(root, file))
          
          print(f"Found {len(php_files)} PHP files")

          # Read file contents
          files_content = ""
          for pf in php_files[:10]:
              try:
                  with open(pf, 'r') as f:
                      content = f.read()
                      files_content += f"\n\n=== {pf} ===\n{content[:1500]}\n"
              except Exception as e:
                  print(f"Error reading {pf}: {e}")

          # Generate solution with Groq
          prompt = f"""
          Generate PHPUnit tests for this Laravel issue:

          **Issue:** {issue.title}
          **Description:** {issue.body}

          **Files:**
          {files_content}

          **Requirements:**
          1. Create tests in tests/Unit/ matching app/ structure
          2. Include edge cases
          3. Mock external services
          4. Follow Laravel testing best practices

          **Output format:**
          ```php
          // tests/Unit/Path/To/ClassTest.php
          <?php
          // test code here
          ```
          """

          response = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[
                  {"role": "system", "content": "You are a Laravel testing expert."},
                  {"role": "user", "content": prompt}
              ],
              temperature=0.2,
              max_tokens=8000
          )

          generated_content = response.choices[0].message.content

          # Extract PHP code blocks
          pattern = r'//\s*(tests/Unit/[^\n]+)\s*```php\s*(.*?)\s*```'
          matches = re.findall(pattern, generated_content, re.DOTALL)

          if not matches:
              pattern = r'```php\s*(//\s*tests/Unit/[^\n]+)?(.*?)\s*```'
              matches = re.findall(pattern, generated_content, re.DOTALL)
              matches = [(m[0].strip('// ') if m[0] else f"tests/Unit/Test{i}.php", m[1]) 
                        for i, m in enumerate(matches) if 'class' in m[1]]

          if not matches:
              print("No test files found!")
              exit(1)

          # Create branch
          branch_name = f"ai-fix-issue-{issue_number}"
          current = repo_local.create_head(branch_name)
          current.checkout()
          print(f"Created branch: {branch_name}")

          # Create test files
          created_files = []
          for filepath, code in matches:
              filepath = filepath.strip()
              if not filepath.endswith('.php'):
                  filepath += '.php'
              
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              
              code = code.strip()
              if not code.startswith('<?php'):
                  code = '<?php\n\n' + code
              
              with open(filepath, 'w') as f:
                  f.write(code)
              
              created_files.append(filepath)
              print(f"Created: {filepath}")

          # Configure git and push
          repo_local.config_writer().set_value("user", "name", "AI Developer").release()
          repo_local.config_writer().set_value("user", "email", "ai@example.com").release()

          if created_files:
              repo_local.git.add(A=True)
              repo_local.git.commit("-m", f"AI-generated tests for issue #{issue_number}")
              repo_local.git.push("--set-upstream", "origin", branch_name)

              # Create PR
              pr = repo.create_pull(
                  title=f"Resolve #{issue_number}: {issue.title}",
                  body=f"AI-generated solution for issue #{issue_number}\n\nChanges:\n" + 
                       "\n".join([f"- `{f}`" for f in created_files]) +
                       f"\n\nCloses #{issue_number}",
                  head=branch_name,
                  base="main"
              )
              
              print(f"Created PR: {pr.html_url}")
              issue.create_comment(f"AI solution generated in PR #{pr.number}")
          EOF
