name: Groq Auto Solver - Fixed Version

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub gitpython

      - name: Run AI Solver
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os, openai, git, re, time
          from github import Github

          # 1. إعدادات الاتصال
          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ.get('GITHUB_REPOSITORY'))
          repo_local = git.Repo(".")
          
          # 2. جلب المشاكل المفتوحة
          issues = [i for i in repo.get_issues(state='open') if not i.pull_request]
          print(f"Found {len(issues)} open issues.")

          for issue in issues:
              branch_name = f"fix/issue-{issue.number}"
              print(f"--- Processing Issue #{issue.number}: {issue.title} ---")
              
              # تجنب التكرار
              try:
                  repo.get_branch(branch_name)
                  print(f"Branch {branch_name} already exists. Skipping.")
                  continue
              except: pass

              # 3. جمع سياق الكود (أهم الملفات فقط لتوفير التوكنز)
              context = ""
              for root, _, files in os.walk("."):
                  if any(d in root for d in ["vendor", "node_modules", ".git"]): continue
                  for f in files:
                      if f.endswith((".php", ".js", ".json")):
                          p = os.path.join(root, f)
                          with open(p, 'r') as file_content:
                              context += f"\nFile: {p}\nContent:\n{file_content.read()[:800]}\n"

              # 4. طلب الحل من AI (بصيغة أكثر صرامة)
              prompt = f"Fix this GitHub issue: {issue.title}\nDescription: {issue.body}\n\nFiles Context:\n{context}\n\nReturn the fix as: FILEPATH: path/to/file.php\nCODE: ```\ncode here\n```"
              
              response = client.chat.completions.create(
                  model="llama-3.3-70b-versatile",
                  messages=[{"role": "system", "content": "You are an expert dev. Always provide the full file path and code block."},
                            {"role": "user", "content": prompt}]
              )
              
              output = response.choices[0].message.content
              # نمط استخراج المسار والكود بشكل أكثر مرونة
              matches = re.findall(r"(?:FILEPATH|File):\s*([^\n\s]+).*?```(?:\w+)?\s*(.*?)\s*```", output, re.DOTALL | re.IGNORECASE)

              if not matches:
                  print("AI didn't return a clear fix format. Skipping.")
                  continue

              # 5. تطبيق التعديلات برمجياً
              repo_local.git.checkout('HEAD', b=branch_name)
              for path, code in matches:
                  path = path.strip().replace(":", "")
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  with open(path, 'w') as f:
                      f.write(code.strip())
                  print(f"Updated file: {path}")

              # 6. الرفع (Push)
              repo_local.config_writer().set_value("user", "name", "AI Solver").release()
              repo_local.config_writer().set_value("user", "email", "ai@solver.com").release()
              repo_local.git.add(A=True)
              repo_local.git.commit("-m", f"Fix issue #{issue.number} via AI")
              
              remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['GITHUB_REPOSITORY']}.git"
              if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                  origin = repo_local.create_remote('origin_auth', remote_url)
              else: origin = repo_local.remote('origin_auth')
              
              origin.push(branch_name)

              # 7. فتح الـ Pull Request مع كلمة الإغلاق التلقائي
              pr = repo.create_pull(
                  title=f"🤖 AI Fix: {issue.title}",
                  body=f"This PR was generated by AI to fix issue #{issue.number}.\n\nCloses #{issue.number}",
                  head=branch_name,
                  base=repo.default_branch
              )
              print(f"Successfully created PR #{pr.number}")
              
              # تعليق على الـ Issue الأصلي
              issue.create_comment(f"I've generated a potential fix in PR #{pr.number}. Once merged, this issue will close.")
              
              # العودة للفرع الرئيسي للمشكلة التالية
              repo_local.git.checkout(repo.default_branch)
              time.sleep(5) # لتجنب Rate Limit الخاص بـ Groq
          EOF
