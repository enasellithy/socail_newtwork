name: Groq Auto Solver - Final Logic Fix

on:
  push:
    branches: [main, master]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub gitpython

      - name: Run AI Solver
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, git, re, time
          from github import Github

          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          repo_local = git.Repo(".")
          default_branch = repo.default_branch

          issues = [i for i in repo.get_issues(state='open') if not i.pull_request]

          for issue in issues:
              branch_name = f"fix/issue-{issue.number}"
              
              try:
                  repo.get_branch(branch_name)
                  continue
              except: pass

              repo_local.git.checkout(default_branch)
              repo_local.git.pull()
              repo_local.git.checkout('-b', branch_name)

              context = ""
              for root, _, files in os.walk("."):
                  if any(d in root for d in ["vendor", "node_modules", ".git"]): continue
                  for f in files:
                      if f.endswith((".php", ".js", ".json", ".md", ".py")):
                          p = os.path.join(root, f)
                          try:
                              with open(p, 'r') as fc:
                                  context += f"\nFILE: {p}\n{fc.read()[:800]}\n"
                          except: pass

              prompt = f"Fix issue #{issue.number}: {issue.title}\n{issue.body}\nContext:\n{context}\nOutput exactly: FILEPATH: path\nCODE: ```\ncontent\n```"
              
              try:
                  response = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[{"role": "system", "content": "Expert developer. Always provide full file paths and content."},
                                {"role": "user", "content": prompt}]
                  )
                  
                  output = response.choices[0].message.content
                  matches = re.findall(r"(?:FILEPATH|FILE|File):\s*([^\n\s]+).*?```(?:\w+)?\s*(.*?)\s*```", output, re.DOTALL | re.IGNORECASE)

                  if not matches:
                      repo_local.git.checkout(default_branch)
                      repo_local.delete_head(branch_name, force=True)
                      continue

                  for path, code in matches:
                      path = path.strip().replace(":", "")
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w') as f:
                          f.write(code.strip())

                  repo_local.config_writer().set_value("user", "name", "AI Bot").release()
                  repo_local.config_writer().set_value("user", "email", "bot@github.com").release()
                  
                  repo_local.git.add(A=True)
                  repo_local.git.commit("-m", f"AI Fix for #{issue.number}")
                  
                  remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
                  if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                      origin = repo_local.create_remote('origin_auth', remote_url)
                  else: origin = repo_local.remote('origin_auth')
                  
                  origin.push(branch_name)

                  repo.create_pull(
                      title=f"🤖 Fix: {issue.title}",
                      body=f"Auto-fix for #{issue.number}.\n\nCloses #{issue.number}",
                      head=branch_name,
                      base=default_branch
                  )
                  
                  repo_local.git.checkout(default_branch)
                  
              except Exception as e:
                  repo_local.git.checkout(default_branch)
          EOF
