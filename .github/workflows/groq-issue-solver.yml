name: Groq Issue Solver

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

jobs:
  solve-issue:
    if: contains(github.event.label.name, 'ai-fix') || contains(github.event.label.name, 'groq') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai PyGithub gitpython

      - name: Solve issue with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import openai
          from github import Github
          import git
          import re

          # Setup Groq client (OpenAI compatible)
          client = openai.OpenAI(
              api_key=os.environ['GROQ_API_KEY'],
              base_url="https://api.groq.com/openai/v1"
          )

          # Connect to GitHub
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo("${{ github.repository }}")
          
          # Get issue number
          if "${{ github.event_name }}" == "workflow_dispatch":
              issue_number = int("${{ github.event.inputs.issue_number }}")
          else:
              issue_number = ${{ github.event.issue.number }}
          
          issue = repo.get_issue(number=issue_number)
          
          print(f"🎯 Processing Issue #{issue_number}: {issue.title}")
          print(f"📝 Description: {issue.body[:200]}...")

          # Get repository PHP files structure
          repo_local = git.Repo(".")
          php_files = []
          for root, dirs, files in os.walk("app"):
              for file in files:
                  if file.endswith(".php"):
                      full_path = os.path.join(root, file)
                      php_files.append(full_path)
          
          print(f"📁 Found {len(php_files)} PHP files in app/")

          # Read file contents (limit to avoid token overflow)
          files_content = ""
          for pf in php_files[:10]:
              try:
                  with open(pf, 'r') as f:
                      content = f.read()
                      files_content += f"\n\n=== FILE: {pf} ===\n{content[:1500]}\n"
              except Exception as e:
                  print(f"⚠️ Error reading {pf}: {e}")

          # Generate solution with Groq
          prompt = f"""
          You are a Laravel testing expert. Please solve this GitHub issue:

          **Issue Title:** {issue.title}
          **Issue Description:** {issue.body}

          **Repository Files (app/ directory):**
          {files_content}

          **TASK:**
          Generate comprehensive PHPUnit unit tests for ALL public functions in the app/ directory.

          **Requirements:**
          1. Create tests in tests/Unit/ matching the exact folder structure of app/
          2. Include edge cases (null values, empty arrays, exceptions)
          3. Mock all external services (databases, APIs, etc.)
          4. Follow Laravel 10+ testing best practices
          5. Use proper test naming: test_it_can_*, test_it_handles_*, etc.
          6. Each test should be independent and isolated

          **Output Format:**
          Provide each test file in this format:

          ```php
          // tests/Unit/Path/To/ClassTest.php
          <?php
          namespace Tests\\Unit\\Path\\To;

          use Tests\\TestCase;
          use App\\Path\\To\\Class;
          ...

          class ClassTest extends TestCase {{
              // tests here
          }}
          ```

          Generate tests for ALL classes found in the files above.
          """

          print("🤖 Sending request to Groq AI...")
          response = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[
                  {"role": "system", "content": "You are an expert Laravel developer specializing in PHPUnit testing. Generate complete, working test code."},
                  {"role": "user", "content": prompt}
              ],
              temperature=0.2,
              max_tokens=8000
          )

          generated_content = response.choices[0].message.content
          print(f"✅ Received {len(generated_content)} characters from Groq")

          # Extract PHP code blocks with file paths
          pattern = r'//\s*(tests/Unit/[^\n]+)\s*```php\s*(.*?)\s*```'
          matches = re.findall(pattern, generated_content, re.DOTALL)

          if not matches:
              # Try alternative pattern
              pattern = r'```php\s*(//\s*tests/Unit/[^\n]+)?(.*?)\s*```'
              matches = re.findall(pattern, generated_content, re.DOTALL)
              matches = [(m[0].strip('// ') if m[0] else f"tests/Unit/GeneratedTest{i}.php", m[1]) 
                        for i, m in enumerate(matches) if 'class' in m[1]]

          if not matches:
              print("❌ No test files found in AI response!")
              print("Response preview:", generated_content[:500])
              exit(1)

          # Create branch
          branch_name = f"ai-fix-issue-{issue_number}"
          current = repo_local.create_head(branch_name)
          current.checkout()
          print(f"🌿 Created branch: {branch_name}")

          # Create test files
          created_files = []
          for filepath, code in matches:
              filepath = filepath.strip()
              if not filepath.endswith('.php'):
                  filepath += '.php'
              
              # Ensure directory exists
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              
              # Clean up code
              code = code.strip()
              if not code.startswith('<?php'):
                  code = '<?php\n\n' + code
              
              with open(filepath, 'w') as f:
                  f.write(code)
              
              created_files.append(filepath)
              print(f"📝 Created: {filepath}")

          # Configure git
          repo_local.config_writer().set_value("user", "name", "AI Developer").release()
          repo_local.config_writer().set_value("user", "email", "ai@example.com").release()

          # Commit and push
          if created_files:
              repo_local.git.add(A=True)
              repo_local.git.commit("-m", f"🤖 AI-generated tests for issue #{issue_number}\n\n- Generated PHPUnit tests for app/ directory\n- Included edge cases and mocks\n- Used Groq AI (llama-3.3-70b-versatile)")
              repo_local.git.push("--set-upstream", "origin", branch_name)
              print(f"📤 Pushed {len(created_files)} files to {branch_name}")

              # Create Pull Request
              pr = repo.create_pull(
                  title=f"🤖 Resolve #{issue_number}: {issue.title}",
                  body=f"""## 🤖 AI-Generated Solution

This PR automatically resolves issue #{issue_number} using Groq AI.

### Changes Made:
{chr(10).join([f'- `{f}`' for f in created_files])}

### AI Model Used:
- **Model:** Llama 3.3 70B Versatile (via Groq)
- **Temperature:** 0.2
- **Max Tokens:** 8000

### Requirements Met:
✅ PHPUnit tests for all public functions in app/  
✅ Organized under tests/Unit/ matching app/ structure  
✅ Edge cases included  
✅ External services mocked  
✅ Independent test execution  

### How to Test:
```bash
composer install
php artisan test
