name: Groq Auto Solver - Strict Branching & PR

on:
  push:
    branches: [main, master]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub gitpython

      - name: Run AI Solver
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, git, re, time
          from github import Github

          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          repo_local = git.Repo(".")
          default_branch = repo.default_branch

          issues = [i for i in repo.get_issues(state='open') if not i.pull_request]

          for issue in issues:
              branch_name = f"fix/issue-{issue.number}"
              
              # التأكد من عدم وجود الفرع مسبقاً لتجنب التكرار
              try:
                  repo.get_branch(branch_name)
                  continue
              except: pass

              # 1. تنظيف بيئة Git والعودة للفرع الرئيسي قبل كل Issue
              repo_local.git.reset('--hard')
              repo_local.git.clean('-fd')
              repo_local.git.checkout(default_branch)
              
              # 2. إنشاء فرع جديد ومستقل لهذه المشكلة تحديداً
              repo_local.git.checkout('-b', branch_name)

              # جمع الكود
              context = ""
              for root, _, files in os.walk("."):
                  if any(d in root for d in ["vendor", "node_modules", ".git"]): continue
                  for f in files:
                      if f.endswith((".php", ".js", ".json", ".md", ".py")):
                          p = os.path.join(root, f)
                          try:
                              with open(p, 'r') as fc:
                                  context += f"\nFILE: {p}\nCONTENT:\n{fc.read()[:1000]}\n"
                          except: pass

              prompt = f"Fix issue #{issue.number}: {issue.title}\n{issue.body}\n\nContext:\n{context}\n\nReturn format:\nFILEPATH: path/to/file\nCODE: ```\ncontents\n```"
              
              try:
                  response = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[{"role": "system", "content": "You are a professional developer. Provide full file contents."},
                                {"role": "user", "content": prompt}]
                  )
                  output = response.choices[0].message.content
                  matches = re.findall(r"(?:FILEPATH|File):\s*([^\n\s]+).*?```(?:\w+)?\s*(.*?)\s*```", output, re.DOTALL | re.IGNORECASE)

                  if not matches:
                      continue
                  
                  # كتابة الملفات الجديدة
                  for path, code in matches:
                      path = path.strip().replace(":", "")
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w') as f:
                          f.write(code.strip())

                  # 3. الحفظ والرفع (Commit & Push) للفرع الجديد
                  repo_local.config_writer().set_value("user", "name", "AI Solver").release()
                  repo_local.config_writer().set_value("user", "email", "bot@ai.com").release()
                  repo_local.git.add(A=True)
                  repo_local.git.commit("-m", f"AI Fix for issue #{issue.number}")
                  
                  remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
                  if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                      origin = repo_local.create_remote('origin_auth', remote_url)
                  else: origin = repo_local.remote('origin_auth')
                  
                  origin.push(branch_name)

                  # 4. إنشاء Pull Request خاص بهذا الفرع
                  pr = repo.create_pull(
                      title=f"🤖 Fix for Issue #{issue.number}",
                      body=f"This PR was generated automatically.\n\nCloses #{issue.number}",
                      head=branch_name,
                      base=default_branch
                  )
                  
                  print(f"✅ Created Branch & PR {pr.html_url} for Issue #{issue.number}")
                  
                  # العودة للفرع الرئيسي استعداداً للمشكلة التالية
                  repo_local.git.checkout(default_branch)
                  time.sleep(5)
                  
              except Exception as e:
                  print(f"Error on issue #{issue.number}: {e}")
                  # في حال حدوث خطأ، نضمن العودة للفرع الرئيسي
                  repo_local.git.reset('--hard')
                  repo_local.git.checkout(default_branch)

          EOF
