name: Groq Auto Solver - Unified Fix

on:
  push:
    branches: [main, master]
  issues:
    types: [opened]
  workflow_dispatch:

# إعطاء صلاحيات كاملة للتوكن لضمان عمل الـ PR
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # استخدام التوكن التلقائي
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai PyGithub gitpython

      - name: Run AI Solver
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os, openai, git, re, time
          from github import Github

          client = openai.OpenAI(api_key=os.environ['GROQ_API_KEY'], base_url="https://api.groq.com/openai/v1")
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          repo_local = git.Repo(".")
          default_branch = repo.default_branch

          issues = [i for i in repo.get_issues(state='open') if not i.pull_request]
          print(f"Found {len(issues)} open issues.")

          for issue in issues:
              branch_name = f"fix/issue-{issue.number}"
              
              try:
                  repo.get_branch(branch_name)
                  print(f"Branch {branch_name} already exists. Skipping.")
                  continue
              except: pass

              print(f"Processing Issue #{issue.number}...")
              
              # تنظيف وإنشاء فرع جديد
              repo_local.git.checkout(default_branch)
              repo_local.git.pull()
              repo_local.git.checkout('-b', branch_name)

              # جمع سياق الملفات (أول 15 ملف فقط لتجنب استهلاك التوكنز)
              context = ""
              for root, _, files in os.walk("."):
                  if any(d in root for d in ["vendor", "node_modules", ".git"]): continue
                  for f in files:
                      if f.endswith((".php", ".js", ".json", ".md", ".py")):
                          p = os.path.join(root, f)
                          try:
                              with open(p, 'r') as fc:
                                  context += f"\n--- FILE: {p} ---\n{fc.read()[:800]}\n"
                          except: pass

              prompt = f"Fix issue #{issue.number}: {issue.title}\n{issue.body}\n\nContext Files:\n{context}\n\nStrict Output Format:\nFILE: path/to/file.ext\nCODE: ```\nfull file content\n```"
              
              try:
                  response = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[{"role": "system", "content": "You are a professional software engineer. Always provide the full file path and the full content of the file to fix the issue."},
                                {"role": "user", "content": prompt}]
                  )
                  
                  output = response.choices[0].message.content
                  #Regex محسن للبحث عن FILE أو File أو FILEPATH
                  matches = re.findall(r"(?:FILE|File|FILEPATH):\s*([^\n\s]+).*?```(?:\w+)?\s*(.*?)\s*```", output, re.DOTALL | re.IGNORECASE)

                  if not matches:
                      print(f"AI didn't provide code in the correct format for issue #{issue.number}")
                      continue

                  for path, code in matches:
                      path = path.strip().replace(":", "")
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w') as f:
                          f.write(code.strip())
                      print(f"Applied changes to: {path}")

                  # إعداد المستخدم وعمل Commit
                  repo_local.config_writer().set_value("user", "name", "AI Bot").release()
                  repo_local.config_writer().set_value("user", "email", "bot@github.com").release()
                  
                  repo_local.git.add(A=True)
                  repo_local.git.commit("-m", f"AI Fix for #{issue.number}")
                  
                  # الرفع باستخدام التوكن
                  remote_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
                  if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                      origin = repo_local.create_remote('origin_auth', remote_url)
                  else: origin = repo_local.remote('origin_auth')
                  
                  origin.push(branch_name)

                  # إنشاء الـ PR
                  pr = repo.create_pull(
                      title=f"🤖 Fix: {issue.title}",
                      body=f"This automated PR fixes issue #{issue.number}.\n\nCloses #{issue.number}",
                      head=branch_name,
                      base=default_branch
                  )
                  print(f"Successfully created PR: {pr.html_url}")
                  
                  # العودة للفرع الرئيسي
                  repo_local.git.checkout(default_branch)
                  
              except Exception as e:
                  print(f"Error processing issue #{issue.number}: {e}")
                  repo_local.git.checkout(default_branch)

          EOF
