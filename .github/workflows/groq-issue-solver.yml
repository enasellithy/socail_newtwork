name: Groq Issue Solver - All Issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-all-issues:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'ai-fix') || contains(github.event.label.name, 'groq')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai PyGithub gitpython

      - name: Solve all open issues with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os
          import openai
          from github import Github
          import git
          import re
          import time

          client = openai.OpenAI(
              api_key=os.environ['GROQ_API_KEY'],
              base_url="https://api.groq.com/openai/v1"
          )

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          repo_local = git.Repo(".")

          open_issues = [issue for issue in repo.get_issues(state='open') if not issue.pull_request]
          
          if not open_issues:
              print("No open issues found!")
              exit(0)

          for issue in open_issues:
              issue_number = issue.number
              branch_name = f"ai-fix-issue-{issue_number}"
              
              try:
                  repo.get_branch(branch_name)
                  continue
              except:
                  pass

              php_files = []
              for root, _, files in os.walk("."):
                  if "vendor" in root or "node_modules" in root or ".git" in root:
                      continue
                  for file in files:
                      if file.endswith(".php"):
                          php_files.append(os.path.join(root, file))

              files_content = ""
              for pf in php_files[:15]:
                  try:
                      with open(pf, 'r') as f:
                          files_content += f"\n--- {pf} ---\n{f.read()[:1500]}\n"
                  except:
                      pass

              prompt = f"Solve Issue #{issue_number}: {issue.title}\nDesc: {issue.body}\n\nFiles:\n{files_content}\n\nOutput only files in this format:\n// path/file.php\n```php\n<?php ...\n```"

              try:
                  response = client.chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[
                          {"role": "system", "content": "You are a Laravel expert. Output full file content for each modified file."},
                          {"role": "user", "content": prompt}
                      ],
                      temperature=0.1
                  )

                  generated = response.choices[0].message.content
                  matches = re.findall(r'//\s*([^\n]+)\s*```php\s*(.*?)\s*```', generated, re.DOTALL)

                  if not matches:
                      continue

                  new_branch = repo_local.create_head(branch_name)
                  new_branch.checkout()

                  created_files = []
                  for filepath, code in matches:
                      filepath = filepath.strip()
                      os.makedirs(os.path.dirname(filepath), exist_ok=True)
                      with open(filepath, 'w') as f:
                          f.write(code.strip())
                      created_files.append(filepath)

                  repo_local.config_writer().set_value("user", "name", "AI Fixer").release()
                  repo_local.config_writer().set_value("user", "email", "ai@fix.com").release()
                  
                  repo_local.git.add(A=True)
                  repo_local.git.commit("-m", f"AI fix for #{issue_number}")
                  
                  auth_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['REPO_NAME']}.git"
                  if 'origin_auth' not in [r.name for r in repo_local.remotes]:
                      remote = repo_local.create_remote('origin_auth', auth_url)
                  else:
                      remote = repo_local.remote('origin_auth')
                  
                  remote.push(refspec=f"{branch_name}:{branch_name}")

                  pr = repo.create_pull(
                      title=f"🤖 Fix #{issue_number}: {issue.title}",
                      body=f"AI generated fix for #{issue_number}",
                      head=branch_name,
                      base=repo.default_branch
                  )
                  issue.create_comment(f"✅ AI solution in PR #{pr.number}")
                  
                  repo_local.heads[repo.default_branch].checkout()
                  time.sleep(5)

              except Exception as e:
                  print(f"Error #{issue_number}: {e}")
                  repo_local.git.checkout(repo.default_branch)
                  continue
          EOF
